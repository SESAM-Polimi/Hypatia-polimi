[pytest]
testpaths = tests
python_files = test_*.py
addopts = -m "not slow"
markers =
    slow: solves an example that needs minutes with open-source solvers; run locally with -m slow (Gurobi recommended)
# Deprecations raised inside other libraries are ignored; the ones triggered by
# Hypatia's own code or by the tests are errors, so that a coming change in
# pandas, numpy or cvxpy fails the tests instead of scrolling past in a log.
# (Later lines take precedence.)
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
    error::FutureWarning:hypatia.*
    error::DeprecationWarning:hypatia.*
    error::FutureWarning:tests.*
    error::DeprecationWarning:tests.*
