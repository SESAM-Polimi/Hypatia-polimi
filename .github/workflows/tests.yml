name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false   # always report both stacks
      matrix:
        include:
          - stack: current   # cvxpy 1.9.2, numpy 2
            python: "3.11"
            requirements: ci/requirements.txt
          - stack: legacy    # cvxpy 1.1.18, numpy 1.22 (environments of earlier versions)
            python: "3.10"
            requirements: ci/requirements-legacy.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install pinned dependencies and Hypatia
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}
          # --no-deps: keep exactly the pinned versions above
          pip install -e . --no-deps

      - name: Run tests (slow examples excluded, see pytest.ini)
        run: pytest -ra
